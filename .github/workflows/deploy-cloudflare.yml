name: Deploy Aikatsu Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikatsu-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Prepare remote D1 database
        run: node setup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migration
        run: npx wrangler d1 execute aikatsu-encore-monitor-state --remote --yes --file=migrations/0001_init.sql --config wrangler.runtime.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Initialize online/offline state table (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute aikatsu-encore-monitor-state --remote --yes --file=migrations/0002_online_state.sql --config wrangler.runtime.toml
      - name: Initialize three-state machine status table (safe migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute aikatsu-encore-monitor-state --remote --yes --file=migrations/0003_three_state.sql --config wrangler.runtime.toml
      - name: Deploy Worker (1-minute Cron)
        # The first upload can create the Worker before its deployment endpoint is ready.
        # Retry deployment to recover from temporary Cloudflare 10007 responses.
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy --config wrangler.runtime.toml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Worker deployment failed after 3 attempts' >&2
              exit 1
            fi
            echo "Cloudflare deployment not ready (attempt $attempt/3). Retrying..."
            sleep $((attempt * 15))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set existing Discord URL as Cloudflare secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'GitHub secret DISCORD_WEBHOOK_URL is missing' >&2
            exit 1
          fi
          printf '%s' "$DISCORD_WEBHOOK_URL" | npx wrangler secret put DISCORD_WEBHOOK_URL --config wrangler.runtime.toml
      - name: Finish
        run: echo 'Cloudflare Worker deployed. Verify /health and Discord before disabling the old GitHub monitor.'
